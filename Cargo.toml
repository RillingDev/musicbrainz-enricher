[package]
name = "musicbrainz_enricher"
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/RillingDev/musicbrainz-enricher"

[dependencies]
log = "0.4.27"
env_logger = "0.11.8"
anyhow = "1.0.98"
itertools = "0.14.0"

clap = { version = "4.5.20", features = ["derive"] }
clap-verbosity-flag = "3.0.2"

tokio = { version = "1.47.1", features = ["full"] }

tokio-postgres = { version = "0.7.13", features = ["with-uuid-1"] }
uuid = { version = "1.17.0", features = ["serde", "v1"] }

reqwest = "0.12.22"
diqwest = "3.1.0"
leaky-bucket = "1.1.2"
quick-xml = "0.38.3"
