[package]
name = "musicbrainz_enricher"
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/RillingDev/musicbrainz-enricher"

[dependencies]
log = "0.4.27"
env_logger = "0.11.8"
anyhow = "1.0.98"

icu = "2.0.0"
itertools = "0.14.0"
regex = "1.11.3"

clap = { version = "4.5.20", features = ["derive"] }
clap-verbosity-flag = "3.0.2"

tokio = { version = "1.47.1", features = ["full"] }
futures = "0.3.31"

tokio-postgres = { version = "0.7.13", features = ["with-uuid-1"] }
uuid = { version = "1.17.0", features = ["serde", "v1"] }

reqwest = { version = "0.13.2", features = ["json"] }
diqwest = "3.1.0"

leaky-bucket = "1.1.2"
quick-xml = "0.39.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
